# Temporary maintenance workflow; deletes itself before publishing the lockfile commit.
name: Refresh security lockfile
on:
  push:
    branches:
      - security/resolve-npm-advisories

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'security: regenerate verified npm lockfile')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/resolve-npm-advisories
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Resolve security patches from npm with lifecycle scripts disabled
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update brace-expansion source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const expected = {
            "node_modules/sharp": "0.35.5",
            "node_modules/source-map-js": "1.2.2",
            "node_modules/brace-expansion": "1.1.21",
            "node_modules/readdir-glob/node_modules/brace-expansion": "2.1.7",
          };
          for (const [path, version] of Object.entries(expected)) {
            assert.equal(lock.packages[path]?.version, version, path);
            console.log(`verified ${path}: ${version}`);
          }
          for (const [pkg, version] of Object.entries(lock.packages["node_modules/sharp"].optionalDependencies)) {
            if (lock.packages[`node_modules/${pkg}`]) {
              assert.equal(lock.packages[`node_modules/${pkg}`].version, version, pkg);
            }
          }
          NODE

      - name: Push only the regenerated lockfile and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-lockfile-refresh.yml
          git add package-lock.json
          git commit -m "security: regenerate verified npm lockfile"
          git push origin HEAD:security/resolve-npm-advisories
