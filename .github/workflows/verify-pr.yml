name: Verify pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seadex-pr-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck and regression tests
        run: npm run verify

      - name: Restore verified public snapshot
        env:
          MIRROR_BASE_URL: https://seadex.pages.dev
        run: npm run data:sync-live

      - name: Verify snapshot integrity
        run: npm run verify:mirror-data

      - name: Build frontend from verified snapshot
        run: npm run build:frontend

      - name: Verify build output and hosting limits
        run: |
          npm run verify:frontend-build
          npm run verify:pages-limits
          npm run verify:surge-limits
