name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-site.yml"
      - ".github/workflows/rebuild-mirror.yml"
      - "frontend/**"
      - "scripts/**"
      - "shared/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.mjs"
  workflow_dispatch:

concurrency:
  group: seadex-production-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: write
    outputs:
      snapshot-id: ${{ steps.snapshot.outputs.snapshot-id }}
      manifest-sha: ${{ steps.snapshot.outputs.manifest-sha }}
      artifact-name: ${{ steps.snapshot.outputs.artifact-name }}
      archive-name: ${{ steps.snapshot.outputs.archive-name }}
    steps:
      - name: Require production branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow publishes production and must run from the main branch." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and regression tests
        run: npm run verify

      - name: Restore verified production snapshot
        env:
          MIRROR_BASE_URL: ${{ format('https://{0}.pages.dev', secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex') }}
        run: npm run data:sync-live

      - name: Build static mirror data
        env:
          ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
          MIRROR_STATUS_URL: ${{ format('https://{0}.pages.dev/mirror-data/status.json', secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex') }}
        run: node scripts/build-static-data.mjs --onUnchanged=materialize --report .mirror-build-report.json

      - name: Verify mirror data
        run: npm run verify:mirror-data

      - name: Build frontend
        run: npm run build:frontend

      - name: Verify frontend build
        run: npm run verify:frontend-build

      - name: Check Cloudflare Pages limits
        run: npm run verify:pages-limits

      - name: Read snapshot identity
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot_id="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/mirror-data/manifest.json','utf8')); process.stdout.write(m.snapshotId);")"
          manifest_sha="$(sha256sum dist/mirror-data/manifest.json | cut -d' ' -f1)"
          archive_name="seadex-mirror-${snapshot_id}.tar.gz"
          artifact_name="mirror-snapshot-${snapshot_id}-${manifest_sha:0:12}"
          {
            echo "snapshot-id=$snapshot_id"
            echo "manifest-sha=$manifest_sha"
            echo "archive-name=$archive_name"
            echo "artifact-name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare Pages access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex' }}
        run: node scripts/verify-cloudflare.mjs

      - name: Deploy Pages site
        id: deploy-pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          wranglerVersion: "4.120.0"
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main --commit-dirty=true

      - name: Verify exact Pages deployment
        env:
          DEPLOYED_SITE_URL: ${{ steps.deploy-pages.outputs.deployment-url }}
          EXPECTED_SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot-id }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.snapshot.outputs.manifest-sha }}
        run: npm run verify:deployed-site

      - name: Verify production alias
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex' }}
          EXPECTED_SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot-id }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.snapshot.outputs.manifest-sha }}
        run: npm run verify:deployed-site

      - name: Prepare verified recovery archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .snapshot-archive
          tar -C dist -czf ".snapshot-archive/${{ steps.snapshot.outputs.archive-name }}" mirror-data
          cp dist/mirror-data/manifest.json .snapshot-archive/manifest.json
          (
            cd .snapshot-archive
            sha256sum "${{ steps.snapshot.outputs.archive-name }}" > archive.sha256
            sha256sum manifest.json > manifest.sha256
          )

      - name: Stage recovery archive for archival job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.snapshot.outputs.artifact-name }}
          path: .snapshot-archive/
          if-no-files-found: error
          retention-days: 1

  archive:
    name: Archive verified snapshot
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified snapshot artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.deploy.outputs.artifact-name }}
          path: .snapshot-release

      - name: Publish recovery release and prune old archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ID: ${{ needs.deploy.outputs.snapshot-id }}
          MANIFEST_SHA: ${{ needs.deploy.outputs.manifest-sha }}
          ARCHIVE_NAME: ${{ needs.deploy.outputs.archive-name }}
          KEEP_SNAPSHOTS: "14"
        run: |
          set -euo pipefail
          tag="snapshot-${SNAPSHOT_ID}-${MANIFEST_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Recovery release $tag already exists; leaving it untouched."
          else
            gh release create "$tag" \
              ".snapshot-release/${ARCHIVE_NAME}" \
              .snapshot-release/archive.sha256 \
              .snapshot-release/manifest.json \
              .snapshot-release/manifest.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Verified snapshot ${SNAPSHOT_ID:0:12}" \
              --prerelease \
              --latest=false \
              --notes "Automated recovery snapshot. This exact data artifact passed local integrity checks and verification against the Cloudflare Pages deployment before archival."
          fi

          mapfile -t stale_tags < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("snapshot-")) | [.published_at, .tag_name] | @tsv' \
              | sort -r \
              | tail -n "+$((KEEP_SNAPSHOTS + 1))" \
              | cut -f2
          )
          for stale_tag in "${stale_tags[@]}"; do
            [ -n "$stale_tag" ] || continue
            echo "Pruning old recovery release $stale_tag"
            gh release delete "$stale_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
