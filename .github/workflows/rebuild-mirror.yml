name: Rebuild mirror

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force a rebuild even if authoritative source fingerprints match
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 */12 * * *"

concurrency:
  group: seadex-production-publish
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      SURGE_DOMAIN: ${{ vars.SURGE_DOMAIN || 'seadex.surge.sh' }}
      SURGE_CLI_VERSION: "0.41.2"
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: write
    outputs:
      skipped: ${{ steps.mirror.outputs.skipped }}
    steps:
      - name: Require production branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow publishes production and must run from the main branch." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and regression tests
        run: npm run verify

      - name: Build static mirror data
        id: mirror
        shell: bash
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
          MIRROR_STATUS_URL: ${{ format('https://{0}.pages.dev/mirror-data/status.json', secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex') }}
        run: |
          set -euo pipefail
          if [ "$FORCE_REBUILD" = "true" ]; then
            node scripts/build-static-data.mjs --force=true --onUnchanged=skip --report .mirror-build-report.json
          else
            node scripts/build-static-data.mjs --onUnchanged=skip --report .mirror-build-report.json
          fi
          skipped="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('.mirror-build-report.json','utf8')); process.stdout.write(String(Boolean(r.skipped)));")"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"

      - name: Check secondary mirror health
        if: steps.mirror.outputs.skipped == 'true'
        id: surge-health
        shell: bash
        env:
          PRIMARY_SITE_BASE_URL: ${{ format('https://{0}.pages.dev', secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex') }}
          SECONDARY_SITE_BASE_URL: ${{ format('https://{0}', env.SURGE_DOMAIN) }}
        run: |
          set -euo pipefail
          node scripts/check-site-peer.mjs --report .surge-health-report.json
          repair="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('.surge-health-report.json','utf8')); process.stdout.write(String(Boolean(r.repair)));")"
          echo "repair=$repair" >> "$GITHUB_OUTPUT"

      - name: Restore verified production snapshot for mirror repair
        if: steps.mirror.outputs.skipped == 'true' && steps.surge-health.outputs.repair == 'true'
        env:
          MIRROR_BASE_URL: ${{ format('https://{0}.pages.dev', secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex') }}
        run: npm run data:sync-live

      - name: Verify mirror data
        if: steps.mirror.outputs.skipped != 'true' || steps.surge-health.outputs.repair == 'true'
        run: npm run verify:mirror-data

      - name: Build frontend
        if: steps.mirror.outputs.skipped != 'true' || steps.surge-health.outputs.repair == 'true'
        run: npm run build:frontend

      - name: Verify frontend build
        if: steps.mirror.outputs.skipped != 'true' || steps.surge-health.outputs.repair == 'true'
        run: npm run verify:frontend-build

      - name: Check Cloudflare Pages limits
        if: steps.mirror.outputs.skipped != 'true' || steps.surge-health.outputs.repair == 'true'
        run: npm run verify:pages-limits

      - name: Check Surge limits
        if: steps.mirror.outputs.skipped != 'true' || steps.surge-health.outputs.repair == 'true'
        run: npm run verify:surge-limits

      - name: Read snapshot identity
        if: steps.mirror.outputs.skipped != 'true' || steps.surge-health.outputs.repair == 'true'
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot_id="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/mirror-data/manifest.json','utf8')); process.stdout.write(m.snapshotId);")"
          manifest_sha="$(sha256sum dist/mirror-data/manifest.json | cut -d' ' -f1)"
          site_fingerprint="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/site-build.json','utf8')); process.stdout.write(m.fingerprint);")"
          {
            echo "snapshot-id=$snapshot_id"
            echo "manifest-sha=$manifest_sha"
            echo "site-fingerprint=$site_fingerprint"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether Cloudflare output changed
        if: steps.mirror.outputs.skipped != 'true' || steps.surge-health.outputs.repair == 'true'
        id: cloudflare-change
        shell: bash
        env:
          SITE_BASE_URL: ${{ format('https://{0}.pages.dev', secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex') }}
        run: |
          set -euo pipefail
          node scripts/check-site-deployment.mjs --report .cloudflare-deploy-report.json
          deploy="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('.cloudflare-deploy-report.json','utf8')); process.stdout.write(String(Boolean(r.deploy)));")"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Check whether Surge output changed
        if: steps.mirror.outputs.skipped != 'true' || steps.surge-health.outputs.repair == 'true'
        id: surge-change
        shell: bash
        env:
          SITE_BASE_URL: ${{ format('https://{0}', env.SURGE_DOMAIN) }}
        run: |
          set -euo pipefail
          node scripts/check-site-deployment.mjs --report .surge-deploy-report.json
          deploy="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('.surge-deploy-report.json','utf8')); process.stdout.write(String(Boolean(r.deploy)));")"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Mark verified publish inputs
        if: steps.mirror.outputs.skipped != 'true' || steps.surge-health.outputs.repair == 'true'
        id: publish-ready
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Skip unchanged Cloudflare deployment
        if: steps.publish-ready.outputs.ready == 'true' && steps.cloudflare-change.outputs.deploy != 'true'
        run: echo "Built site is byte-identical to verified Cloudflare production; skipping Pages deployment."

      - name: Skip unchanged Surge deployment
        if: steps.publish-ready.outputs.ready == 'true' && steps.surge-change.outputs.deploy != 'true'
        run: echo "Built site is byte-identical to verified Surge production; skipping Surge deployment."

      - name: Verify Cloudflare Pages access
        if: steps.publish-ready.outputs.ready == 'true' && steps.cloudflare-change.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex' }}
        run: node scripts/verify-cloudflare.mjs

      - name: Deploy Pages site
        if: steps.publish-ready.outputs.ready == 'true' && steps.cloudflare-change.outputs.deploy == 'true'
        id: deploy-pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          wranglerVersion: "4.120.0"
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main --commit-dirty=true

      - name: Verify exact Pages deployment
        id: verify-pages-deployment
        if: steps.publish-ready.outputs.ready == 'true' && steps.cloudflare-change.outputs.deploy == 'true'
        env:
          DEPLOYED_SITE_URL: ${{ steps.deploy-pages.outputs.deployment-url }}
          EXPECTED_SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot-id }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.snapshot.outputs.manifest-sha }}
          EXPECTED_SITE_FINGERPRINT: ${{ steps.snapshot.outputs.site-fingerprint }}
        run: npm run verify:deployed-site

      - name: Verify production alias
        id: verify-cloudflare-primary
        if: steps.publish-ready.outputs.ready == 'true' && steps.cloudflare-change.outputs.deploy == 'true'
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex' }}
          EXPECTED_SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot-id }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.snapshot.outputs.manifest-sha }}
          EXPECTED_SITE_FINGERPRINT: ${{ steps.snapshot.outputs.site-fingerprint }}
        run: npm run verify:deployed-site

      - name: Deploy Surge mirror
        if: ${{ always() && steps.publish-ready.outputs.ready == 'true' && steps.surge-change.outputs.deploy == 'true' }}
        id: deploy-surge
        shell: bash
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot-id }}
        run: |
          set -euo pipefail
          if [ -z "${SURGE_TOKEN:-}" ]; then
            echo "SURGE_TOKEN is required when the Surge mirror needs publication." >&2
            exit 1
          fi
          npm exec --yes --package="surge@${SURGE_CLI_VERSION}" -- surge ./dist "https://${SURGE_DOMAIN}" --message "snapshot ${SNAPSHOT_ID}" 2>&1 | node scripts/redact-surge-output.mjs

      - name: Verify Surge mirror
        id: verify-surge-backup
        if: ${{ always() && steps.publish-ready.outputs.ready == 'true' && steps.surge-change.outputs.deploy == 'true' && steps.deploy-surge.outcome == 'success' }}
        env:
          DEPLOYED_SITE_URL: ${{ format('https://{0}', env.SURGE_DOMAIN) }}
          EXPECTED_SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot-id }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.snapshot.outputs.manifest-sha }}
          EXPECTED_SITE_FINGERPRINT: ${{ steps.snapshot.outputs.site-fingerprint }}
        run: npm run verify:deployed-site

      - name: Ensure Surge stable deployment
        if: ${{ always() && steps.publish-ready.outputs.ready == 'true' && (steps.surge-change.outputs.deploy != 'true' || (steps.deploy-surge.outcome == 'success' && steps.verify-surge-backup.outcome == 'success')) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/register-github-deployment.mjs
          --environment "Surge Backup"
          --url "https://${SURGE_DOMAIN}"
          --description "Verified Surge backup mirror"
          --snapshot "${{ steps.snapshot.outputs.snapshot-id }}"
          --fingerprint "${{ steps.snapshot.outputs.site-fingerprint }}"

      - name: Ensure Cloudflare stable deployment
        if: ${{ always() && steps.publish-ready.outputs.ready == 'true' && (steps.cloudflare-change.outputs.deploy != 'true' || (steps.deploy-pages.outcome == 'success' && steps.verify-pages-deployment.outcome == 'success' && steps.verify-cloudflare-primary.outcome == 'success')) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STABLE_DEPLOYMENT_URL: ${{ format('https://{0}.pages.dev', secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'seadex') }}
        run: >-
          node scripts/register-github-deployment.mjs
          --environment "production"
          --url "$STABLE_DEPLOYMENT_URL"
          --description "Verified Cloudflare primary alias"
          --snapshot "${{ steps.snapshot.outputs.snapshot-id }}"
          --fingerprint "${{ steps.snapshot.outputs.site-fingerprint }}"
